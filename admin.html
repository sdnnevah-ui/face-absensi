<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN FACE ABSENSI</title><script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script><style>body{margin:0;padding:15px;background:#101010;color:#fff;font-family:Arial}.c{max-width:900px;margin:auto}.p{background:#202020;padding:16px;border-radius:9px;margin:14px 0}input,select{width:100%;padding:11px;margin:6px 0 12px;background:#111;color:#fff;border:1px solid #555;border-radius:6px}button{padding:11px 16px;margin:5px;border:0;border-radius:7px;background:#1976d2;color:#fff}.green{background:#16833b}.red{background:#a22}.gray{background:#444}.status{padding:10px;background:#292929;border-radius:7px}.cam{max-width:600px;margin:auto;background:#000}.cam video{width:100%;display:block;transform:scaleX(-1)}.person{display:flex;justify-content:space-between;padding:10px;background:#292929;margin:7px 0;border-radius:7px}.small{color:#aaa;font-size:12px}.hidden{display:none}.preview{max-width:180px;max-height:180px;display:block;margin:10px auto}</style></head><body><div class=c><h1>🔐 ADMIN FACE ABSENSI</h1><div id=login class=p><h2>Login Admin</h2><input id=pass type=password placeholder="Password admin"><button class=green onclick=loginAdmin>LOGIN</button><div id=ls class=status></div></div><div id=panel class=hidden><div class=p><button class=gray onclick="location.href='index.html'">← ABSENSI</button><button class=red onclick=logout>LOGOUT</button></div><div class=p><h2>⚙️ Lokasi Sekolah</h2><input id=lat type=number step=any><input id=lng type=number step=any><label>Radius meter</label><input id=radius type=number min=10 max=5000><button class=green onclick=saveConfig>SIMPAN LOKASI</button><div id=cs class=status></div></div><div class=p><h2>➕ Daftar Wajah</h2><input id=nm placeholder="Nama lengkap"><select id=tp><option>SISWA</option><option>GURU</option><option>STAFF</option></select><input id=ident placeholder="NISN / NIP / ID"><div class=cam><video id=vid autoplay muted playsinline></video></div><button class=green onclick=start>▶ KAMERA</button><button class=green onclick=capture>📸 AMBIL SAMPEL</button><button class=gray onclick=stop>STOP</button><label>Upload JPG/JPEG/PNG</label><input id=file type=file accept="image/jpeg,image/png" onchange=upload(event)><img id=preview class="preview hidden"><div id=ss class=status>0 sampel</div><button class=green onclick=save>💾 SIMPAN</button></div><div class=p><h2>👥 DATA WAJAH</h2><div id=list></div></div></div></div><script>
const API='https://script.google.com/macros/s/AKfycbxMP6hm7ctCC2pfcButCpxysw02C62aU7usatWJpSvodHbQnq5PKJC7KjsZn4yS5B5y/exec',MODEL='./models',TK='face_admin_token';let token=sessionStorage.getItem(TK)||'',stream=null,ds=[],ready=false,people=[];const $=x=>document.getElementById(x);async function get(a){let r=await fetch(API+'?action='+a+'&t='+Date.now()),d=await r.json();if(!d.success)throw Error(d.error||'API gagal');return d}async function post(x){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(x)}),d=await r.json();if(!d.success)throw Error(d.error||'API gagal');return d}async function loginAdmin(){try{let d=await post({action:'login',password:$('pass').value});token=d.token;sessionStorage.setItem(TK,token);show();await init()}catch(e){$('ls').textContent='❌ '+e.message}}function show(){$('login').classList.add('hidden');$('panel').classList.remove('hidden')}function logout(){sessionStorage.removeItem(TK);location.reload()}async function init(){try{await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL);await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL);await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL);ready=true;let c=await get('config');$('lat').value=c.config.latitude;$('lng').value=c.config.longitude;$('radius').value=c.config.radius;await sync()}catch(e){$('ss').textContent='❌ '+e.message}}async function sync(){let d=await get('faces');people=d.people||[];$('list').innerHTML='';people.forEach(p=>{let x=document.createElement('div');x.className='person';x.innerHTML='<span><b>'+esc(p.name)+'</b><br><span class=small>'+esc(p.type)+' • '+esc(p.identity)+' • '+(p.descriptors||[]).length+' sampel</span></span>';let b=document.createElement('button');b.className='red';b.textContent='HAPUS';b.onclick=()=>del(p.id);x.appendChild(b);$('list').appendChild(x)})}async function saveConfig(){try{let d=await post({action:'saveConfig',token,data:{latitude:+$('lat').value,longitude:+$('lng').value,radius:+$('radius').value}});$('cs').textContent='✅ Tersimpan. Radius '+d.config.radius+' m'}catch(e){$('cs').textContent='❌ '+e.message}}async function start(){if(stream)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('vid').srcObject=stream;await $('vid').play()}catch(e){$('ss').textContent='❌ '+e.message}}function stop(){if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}$('vid').srcObject=null}async function capture(){if(!ready||!stream)return alert('Kamera/model belum siap.');let d=await faceapi.detectSingleFace($('vid'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();if(!d)return alert('Wajah tidak ditemukan.');ds.push(Array.from(d.descriptor));$('ss').textContent='✅ '+ds.length+' sampel'}async function upload(e){let f=e.target.files[0];if(!f)return;let img=new Image();img.onload=async()=>{let d=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();if(!d)return alert('Wajah tidak ditemukan pada file.');ds.push(Array.from(d.descriptor));$('preview').src=img.src;$('preview').classList.remove('hidden');$('ss').textContent='✅ '+ds.length+' sampel'};img.src=URL.createObjectURL(f)}async function save(){let name=$('nm').value.trim(),identity=$('ident').value.trim();if(!name||!identity||!ds.length)return alert('Nama, identitas, dan minimal satu sampel wajib.');try{await post({action:'register',token,data:{id:'person_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),name,type:$('tp').value,identity,descriptors:ds}});$('nm').value='';$('ident').value='';ds=[];$('file').value='';$('preview').classList.add('hidden');$('ss').textContent='0 sampel';await sync();alert('Data wajah berhasil disimpan.')}catch(e){$('ss').textContent='❌ '+e.message}}async function del(id){if(!confirm('Hapus data ini?'))return;try{await post({action:'delete',token,data:{id}});await sync()}catch(e){alert(e.message)}}function esc(x){let d=document.createElement('div');d.textContent=x??'';return d.innerHTML}addEventListener('load',()=>{if(token){show();init()}});
</script></body></html>
