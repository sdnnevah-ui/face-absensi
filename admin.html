<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN FACE ABSENSI</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
body{margin:0;padding:15px;background:#101010;color:#fff;font-family:Arial,sans-serif}.c{max-width:900px;margin:auto}.p{background:#202020;padding:16px;border-radius:9px;margin:14px 0}input,select{width:100%;padding:11px;margin:6px 0 12px;background:#111;color:#fff;border:1px solid #555;border-radius:6px;box-sizing:border-box}button{padding:11px 16px;margin:5px;border:0;border-radius:7px;background:#1976d2;color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.green{background:#16833b}.red{background:#a22}.gray{background:#444}.status{padding:10px;background:#292929;border-radius:7px}.cam{max-width:600px;margin:auto;background:#000}.cam video{width:100%;display:block;transform:scaleX(-1)}.person{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#292929;margin:7px 0;border-radius:7px}.small{color:#aaa;font-size:12px}.hidden{display:none}.preview{max-width:180px;max-height:180px;display:block;margin:10px auto}
</style>
</head>
<body>
<div class="c">
<h1>🔐 ADMIN FACE ABSENSI</h1>
<div id="login" class="p">
<h2>Login Admin</h2>
<input id="pass" type="password" placeholder="Password admin">
<button id="loginBtn" class="green">LOGIN</button>
<div id="ls" class="status">Masukkan password admin.</div>
</div>
<div id="panel" class="hidden">
<div class="p"><button id="backBtn" class="gray">← ABSENSI</button><button id="logoutBtn" class="red">LOGOUT</button></div>
<div class="p">
<h2>⚙️ Lokasi Sekolah</h2>
<label>Latitude</label><input id="lat" type="number" step="any">
<label>Longitude</label><input id="lng" type="number" step="any">
<label>Radius meter</label><input id="radius" type="number" min="10" max="5000">
<button id="saveConfigBtn" class="green">SIMPAN LOKASI</button><div id="cs" class="status"></div>
</div>
<div class="p">
<h2>➕ Daftar Wajah</h2>
<input id="nm" placeholder="Nama lengkap">
<select id="tp"><option>SISWA</option><option>GURU</option><option>STAFF</option></select>
<input id="ident" placeholder="NISN / NIP / ID">
<div class="cam"><video id="vid" autoplay muted playsinline></video></div>
<button id="startBtn" class="green">▶ KAMERA</button>
<button id="captureBtn" class="green">📸 AMBIL SAMPEL</button>
<button id="stopBtn" class="gray">STOP</button>
<label>Upload JPG/JPEG/PNG</label>
<input id="file" type="file" accept="image/jpeg,image/png">
<img id="preview" class="preview hidden">
<div id="ss" class="status">0 sampel</div>
<button id="saveBtn" class="green">💾 SIMPAN</button>
</div>
<div class="p"><h2>👥 DATA WAJAH</h2><div id="list">Memuat...</div></div>
</div>
</div>
<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbxMP6hm7ctCC2pfcButCpxysw02C62aU7usatWJpSvodHbqNq5PKJC7KjsZn4yS5B5y/exec';
const MODEL='./models',TK='face_admin_token';
let token=sessionStorage.getItem(TK)||'',stream=null,ds=[],ready=false,people=[];
const $=id=>document.getElementById(id);
async function getApi(action){const r=await fetch(API+'?action='+encodeURIComponent(action)+'&t='+Date.now());const d=await r.json();if(!d.success)throw Error(d.error||'API gagal');return d}
async function postApi(data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});const d=await r.json();if(!d.success)throw Error(d.error||'API gagal');return d}
async function loginAdmin(){
 const password=$('pass').value;
 if(!password){$('ls').textContent='❌ Password belum diisi.';return}
 $('loginBtn').disabled=true;$('ls').textContent='⏳ Memeriksa password...';
 try{const d=await postApi({action:'login',password});token=d.token;sessionStorage.setItem(TK,token);showPanel();await initAdmin()}catch(e){$('ls').textContent='❌ '+e.message}finally{$('loginBtn').disabled=false}
}
function showPanel(){$('login').classList.add('hidden');$('panel').classList.remove('hidden')}
function logout(){sessionStorage.removeItem(TK);token='';location.reload()}
async function initAdmin(){
 $('ss').textContent='⏳ Memuat model wajah...';
 try{
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL);await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL);await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL);ready=true;$('ss').textContent='✅ Model siap — 0 sampel';
 }catch(e){ready=false;$('ss').textContent='⚠️ Model belum siap: '+e.message+' | Pastikan folder models ada di GitHub Pages.'}
 try{const c=await getApi('config');$('lat').value=c.config.latitude;$('lng').value=c.config.longitude;$('radius').value=c.config.radius;await sync()}catch(e){$('cs').textContent='❌ '+e.message}
}
async function sync(){try{const d=await getApi('faces');people=d.people||d.data||[];renderPeople()}catch(e){$('list').textContent='❌ '+e.message}}
function renderPeople(){$('list').innerHTML='';if(!people.length){$('list').textContent='Belum ada data wajah.';return}people.forEach(p=>{const x=document.createElement('div');x.className='person';const s=document.createElement('span');s.innerHTML='<b>'+esc(p.name)+'</b><br><span class="small">'+esc(p.type)+' • '+esc(p.identity)+' • '+(p.descriptors||[]).length+' sampel</span>';const b=document.createElement('button');b.className='red';b.textContent='HAPUS';b.addEventListener('click',()=>del(p.id));x.appendChild(s);x.appendChild(b);$('list').appendChild(x)})}
async function saveConfig(){try{const d=await postApi({action:'saveConfig',token,data:{latitude:+$('lat').value,longitude:+$('lng').value,radius:+$('radius').value}});$('cs').textContent='✅ Tersimpan. Radius '+d.config.radius+' m'}catch(e){$('cs').textContent='❌ '+e.message}}
async function start(){
 if(stream)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('ss').textContent='❌ Browser tidak mendukung kamera atau halaman belum HTTPS.';return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('vid').srcObject=stream;await $('vid').play();$('ss').textContent=ready?'📷 Kamera aktif — siap ambil sampel.':'⚠️ Kamera aktif, tetapi model belum siap.'}catch(e){$('ss').textContent='❌ Kamera: '+e.message}}
function stop(){if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}$('vid').srcObject=null}
async function capture(){
 if(!ready){alert('Model wajah belum siap. Pastikan folder models tersedia dan halaman dibuka melalui HTTPS.');return}
 if(!stream){alert('Nyalakan kamera terlebih dahulu.');return}
 try{const d=await faceapi.detectSingleFace($('vid'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();if(!d){alert('Wajah tidak ditemukan. Posisikan wajah di depan kamera.');return}ds.push(Array.from(d.descriptor));$('ss').textContent='✅ '+ds.length+' sampel'}catch(e){$('ss').textContent='❌ Gagal mengambil sampel: '+e.message}}
async function uploadFile(e){
 const f=e.target.files[0];if(!f)return;
 if(!ready){alert('Model wajah belum siap.');e.target.value='';return}
 const url=URL.createObjectURL(f),img=new Image();
 img.onload=async()=>{try{const d=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();if(!d){alert('Wajah tidak ditemukan pada file.');return}ds.push(Array.from(d.descriptor));$('preview').src=url;$('preview').classList.remove('hidden');$('ss').textContent='✅ '+ds.length+' sampel'}catch(err){alert('Gagal membaca gambar: '+err.message)}};img.onerror=()=>alert('File gambar tidak dapat dibaca.');img.src=url;
}
async function save(){
 const name=$('nm').value.trim(),identity=$('ident').value.trim();
 if(!name||!identity||!ds.length){alert('Nama, identitas, dan minimal satu sampel wajib.');return}
 $('saveBtn').disabled=true;$('ss').textContent='⏳ Menyimpan data wajah...';
 try{await postApi({action:'register',token,data:{id:'person_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),name,type:$('tp').value,identity,descriptors:ds}});$('nm').value='';$('ident').value='';ds=[];$('file').value='';$('preview').src='';$('preview').classList.add('hidden');$('ss').textContent='✅ Data tersimpan. 0 sampel';await sync();alert('Data wajah berhasil disimpan.')}catch(e){$('ss').textContent='❌ '+e.message}finally{$('saveBtn').disabled=false}
}
async function del(id){if(!confirm('Hapus data wajah ini?'))return;try{await postApi({action:'delete',token,data:{id}});await sync()}catch(e){alert('Gagal menghapus: '+e.message)}}
function esc(x){const d=document.createElement('div');d.textContent=x??'';return d.innerHTML}
window.addEventListener('DOMContentLoaded',()=>{
 $('loginBtn').addEventListener('click',loginAdmin);
 $('pass').addEventListener('keydown',e=>{if(e.key==='Enter')loginAdmin()});
 $('backBtn').addEventListener('click',()=>location.href='index.html');
 $('logoutBtn').addEventListener('click',logout);
 $('saveConfigBtn').addEventListener('click',saveConfig);
 $('startBtn').addEventListener('click',start);
 $('captureBtn').addEventListener('click',capture);
 $('stopBtn').addEventListener('click',stop);
 $('file').addEventListener('change',uploadFile);
 $('saveBtn').addEventListener('click',save);
 if(token){showPanel();initAdmin()}
});
</script>
</body></html>
