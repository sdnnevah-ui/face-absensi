<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 15px;

    background: #101010;

    color: white;

    font-family: Arial, sans-serif;

}

.container {

    width: 100%;

    max-width: 1000px;

    margin: auto;

}

h1 {

    text-align: center;

    margin: 5px 0;

}

.subtitle {

    text-align: center;

    color: #aaa;

    margin-bottom: 15px;

}


/* ============================================================
   STATUS
============================================================ */

.status {

    padding: 12px;

    border-radius: 8px;

    text-align: center;

    margin: 10px auto;

    font-weight: bold;

    background: #252525;

    color: #aaa;

}

    color: #55ff77;

}

.status.loading {

    color: #ffe66b;

}

.status.error {

    color: #ff6666;

/* ============================================================
   CAMERA
============================================================ */

.camera {

    position: relative;

    width: 100%;

    max-width: 700px;

    margin: auto;

    background: black;

    border: 2px solid #444;

    border-radius: 10px;

    overflow: hidden;

}

video {

    display: block;

    width: 100%;

    height: auto;

    transform: scaleX(-1);

}


/*
Canvas TIDAK mirror.
*/

canvas {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    pointer-events: none;

}


/* ============================================================
   BUTTON
============================================================ */

.buttons {

    text-align: center;

    margin: 12px 0;

}

button {

    padding: 11px 18px;

    margin: 5px;

    border: none;

    border-radius: 7px;

    color: white;

    background: #1976d2;

    font-size: 15px;

    cursor: pointer;

}

button:hover {

    background: #2196f3;

}

button:disabled {

    background: #555;

    cursor: not-allowed;

}

.btn-green {

    background: #16833b;

}

.btn-green:hover {

    background: #1ba94c;

}

.btn-red {

    background: #a82222;

}

.btn-red:hover {

    background: #d52b2b;

}

.btn-gray {

    background: #444;

}


/* ============================================================
   INFO
============================================================ */

.info {

    max-width: 700px;

    margin: 15px auto;

    padding: 15px;

    background: #1c1c1c;

    border-radius: 8px;

    font-family: monospace;

    line-height: 1.7;

}

.green {

    color: #00ff66;

}

.yellow {

    color: #ffe66b;

}

.red {

    color: #ff5555;

}


/* ============================================================
   DATABASE
============================================================ */

.database {

    margin-top: 20px;

    padding: 15px;

    background: #1c1c1c;

    border-radius: 10px;

}

.database h2 {

    margin-top: 0;

}

.person {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 10px;

    margin: 7px 0;

    background: #292929;

    border-radius: 7px;

}

.person-info {

    flex: 1;

}

.person-name {

    font-weight: bold;

    font-size: 17px;

}

.person-type {

    color: #aaa;

    font-size: 13px;

}

.delete {

    background: #9c2020;

    padding: 7px 10px;

}


/* ============================================================
   MODAL
============================================================ */

.modal {

    display: none;

    position: fixed;

    z-index: 1000;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

    background: rgba(0,0,0,0.85);

    overflow: auto;

}

.modal-content {

    width: 95%;

    max-width: 600px;

    margin: 30px auto;

    padding: 20px;

    background: #202020;

    border-radius: 10px;

}

.modal h2 {

    margin-top: 0;

}

label {

    display: block;

    margin-top: 10px;

    margin-bottom: 5px;

    color: #ccc;

}

input,

select {

    width: 100%;

    padding: 11px;

    border-radius: 6px;

    border: 1px solid #555;

    background: #111;

    color: white;

    font-size: 16px;

}


/* ============================================================
   SAMPLE FACE
============================================================ */

.sample-status {

    margin: 10px 0;

    padding: 10px;

    background: #292929;

    border-radius: 7px;

    text-align: center;

}

</style>

<script>


// ============================================================
// CONFIG
// ============================================================

const MODEL_URL = "./models";

const STORAGE_KEY =
    "face_absensi_database_v1";


// ============================================================
// ELEMENT
// ============================================================

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("overlay");

const statusBox =
    document.getElementById("status");

const modelStatus =
    document.getElementById("modelStatus");

const faceStatus =
    document.getElementById("faceStatus");

const nameStatus =
    document.getElementById("nameStatus");

const typeStatus =
    document.getElementById("typeStatus");

const scoreStatus =
    document.getElementById("scoreStatus");

const startButton =
    document.getElementById("startButton");

const dbStatus =
    document.getElementById("dbStatus");


// ============================================================
// DATABASE
// ============================================================

let people = [];

let faceMatcher = null;


// ============================================================
// CAMERA
// ============================================================

let cameraStream = null;

let detecting = false;


// ============================================================
// REGISTER SAMPLE
// ============================================================

let capturedDescriptor = null;


// ============================================================
// LOAD DATABASE
// ============================================================

function loadDatabase()
{

    try
    {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved)
        {

            people = [];

            return;

        }

        people =
            JSON.parse(saved);

        rebuildFaceMatcher();

        updateDatabaseUI();

    }

    catch(error)
    {

        console.error(
            "Database error:",
            error);

        people = [];

    }

}


// ============================================================
// SAVE DATABASE
// ============================================================

function saveDatabase()
{

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(people)

    );

}


// ============================================================
// REBUILD FACE MATCHER
// ============================================================

function rebuildFaceMatcher()
{

    if (people.length === 0)
    {

        faceMatcher = null;

        return;

    }


    const descriptors =
        [];


    people.forEach(
        person =>
        {

            person.descriptors.forEach(
                descriptor =>
                {

                    descriptors.push(

                        new faceapi.LabeledFaceDescriptors(

                            person.id,

                            [

                                new Float32Array(
                                    descriptor
                                )

                            ]

                        )

                    );

                }
            );

        }
    );


    /*
    FaceMatcher dapat menerima beberapa
    descriptor untuk satu orang.
    */

    faceMatcher =
        new faceapi.FaceMatcher(

            descriptors,

            0.52

        );

}


// ============================================================
// DATABASE UI
// ============================================================

function updateDatabaseUI()
{

    dbStatus.innerText =
        people.length +
        " orang";


    const list =
        document.getElementById(
            "peopleList"
        );


    if (people.length === 0)
    {

        list.innerHTML =
            "Belum ada data.";

        return;

    }


    list.innerHTML = "";


    people.forEach(
        person =>
        {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "person";


            div.innerHTML = `

                <div class="person-info">

                    <div class="person-name">

                        ${escapeHTML(person.name)}

                    </div>

                    <div class="person-type">

                        ${getTypeIcon(person.type)}

                        ${escapeHTML(person.type)}

                        • ${escapeHTML(person.identity)}

                        • ${person.descriptors.length} sampel

                    </div>

                </div>


                <button
                    class="delete"
                    onclick="deletePerson('${person.id}')">

                    🗑 HAPUS

                </button>

            `;


            list.appendChild(div);

        }
    );

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(text)
{

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


// ============================================================
// TYPE ICON
// ============================================================

function getTypeIcon(type)
{

    if (type === "GURU")
        return "👨‍🏫";

    if (type === "STAFF")
        return "👩‍💼";

    return "👨‍🎓";

}


// ============================================================
// LOAD MODELS
// ============================================================

async function loadModels()
{

    try
    {

        statusBox.className =
            "status loading";

        statusBox.innerText =
            "⏳ Memuat Tiny Face Detector...";


        await faceapi.nets.tinyFaceDetector
            .loadFromUri(MODEL_URL);


        statusBox.innerText =
            "⏳ Memuat Face Landmark 68...";


        await faceapi.nets.faceLandmark68Net
            .loadFromUri(MODEL_URL);


        statusBox.innerText =
            "⏳ Memuat Face Recognition...";


        await faceapi.nets.faceRecognitionNet
            .loadFromUri(MODEL_URL);


        modelStatus.innerText =
            "SEMUA MODEL OK";

        modelStatus.className =
            "green";


        statusBox.className =
            "status ready";

        statusBox.innerText =
            "✅ MODEL AI SIAP";


        startButton.disabled =
            false;


        loadDatabase();


        console.log(
            "Face API ready"
        );

    }

    catch(error)
    {

        console.error(
            error
        );


        statusBox.className =
            "status error";


        statusBox.innerText =
            "❌ GAGAL MEMUAT MODEL";


        modelStatus.innerText =
            error.message;


        modelStatus.className =
            "red";

    }

}


// ============================================================
// START CAMERA
// ============================================================

async function startCamera()
{

    try
    {

        if (cameraStream)
            return;


        statusBox.className =
            "status loading";

        statusBox.innerText =
            "⏳ Meminta akses kamera...";


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: "user",

                        width: {
                            ideal: 640
                        },

                        height: {
                            ideal: 480
                        }

                    },

                    audio: false

                });


        video.srcObject =
            cameraStream;


        await video.play();


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        statusBox.className =
            "status ready";

        statusBox.innerText =
            "📷 KAMERA AKTIF";


        startButton.disabled =
            true;


        detecting =
            true;


        detectLoop();

    }

    catch(error)
    {

        console.error(
            "Camera error:",
            error
        );


        statusBox.className =
            "status error";


        statusBox.innerText =
            "❌ GAGAL MEMBUKA KAMERA";


        faceStatus.innerText =
            error.name;

        faceStatus.className =
            "red";

    }

}


// ============================================================
// STOP CAMERA
// ============================================================

function stopCamera()
{

    detecting = false;


    if (cameraStream)
    {

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        cameraStream = null;

    }


    video.srcObject = null;


    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    startButton.disabled =
        false;


    statusBox.className =
        "status";

    statusBox.innerText =
        "⏹ KAMERA BERHENTI";

}


// ============================================================
// DETECTION LOOP
// ============================================================

async function detectLoop()
{

    if (!detecting)
        return;


    if (!video.videoWidth)
    {

        requestAnimationFrame(
            detectLoop
        );

        return;

    }


    try
    {

        const detections =
            await faceapi
                .detectAllFaces(

                    video,

                    new faceapi
                        .TinyFaceDetectorOptions({

                            inputSize: 320,

                            scoreThreshold: 0.5

                        })

                )
                .withFaceLandmarks()
                .withFaceDescriptors();


        drawResults(
            detections
        );

    }

    catch(error)
    {

        console.error(
            "Detection error:",
            error
        );

    }


    setTimeout(
        detectLoop,
        120
    );

}


// ============================================================
// DRAW RESULTS
// ============================================================

function drawResults(
    detections
)
{

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(

        0,
        0,
        canvas.width,
        canvas.height

    );


    const displaySize = {

        width:
            video.videoWidth,

        height:
            video.videoHeight

    };


    faceapi.matchDimensions(

        canvas,

        displaySize

    );


    let resized =
        faceapi.resizeResults(

            detections,

            displaySize

        );


    // ========================================================
    // IMPORTANT
    // ========================================================
    //
    // Video mirror.
    //
    // Canvas tidak mirror.
    //
    // Jadi koordinat wajah harus dibalik
    // agar kotak mengikuti gambar mirror.
    //


    if (resized.length === 0)
    {

        faceStatus.innerText =
            "TIDAK ADA WAJAH";

        faceStatus.className =
            "yellow";

        nameStatus.innerText =
            "-";

        typeStatus.innerText =
            "-";

        scoreStatus.innerText =
            "-";

        return;

    }


    faceStatus.innerText =
        resized.length +
        " WAJAH TERDETEKSI";

    faceStatus.className =
        "green";


    resized.forEach(
        (result) =>
        {

            const originalBox =
                result.detection.box;


            const box = {

                x:
                    canvas.width -
                    originalBox.x -
                    originalBox.width,

                y:
                    originalBox.y,

                width:
                    originalBox.width,

                height:
                    originalBox.height

            };


            const detectionScore =
                result.detection.score;


            // =================================================
            // DRAW BOX
            // =================================================

            ctx.strokeStyle =
                "#00ff55";

            ctx.lineWidth =
                3;


            ctx.strokeRect(

                box.x,

                box.y,

                box.width,

                box.height

            );


            // =================================================
            // DETECTION SCORE
            // =================================================

            ctx.fillStyle =
                "#00ff55";

            ctx.font =
                "bold 17px Arial";


            ctx.fillText(

                "FACE " +
                (detectionScore * 100)
                    .toFixed(1) +
                "%",

                box.x,

                Math.max(
                    20,
                    box.y - 8
                )

            );


            // =================================================
            // RECOGNITION
            // =================================================

            recognizeFace(

                result,

                box

            );

        }
    );

}


// ============================================================
// RECOGNITION
// ============================================================

function recognizeFace(
    result,
    box
)
{

    if (!faceMatcher)
    {

        drawUnknown(
            box
        );

        nameStatus.innerText =
            "UNKNOWN";

        typeStatus.innerText =
            "-";

        scoreStatus.innerText =
            "-";

        return;

    }


    try
    {

        const bestMatch =
            faceMatcher.findBestMatch(

                result.descriptor

            );


        const person =
            people.find(
                p =>
                    p.id ===
                    bestMatch.label
            );


        const distance =
            bestMatch.distance;


        scoreStatus.innerText =
            distance.toFixed(3);


        // ====================================================
        // KNOWN
        // ====================================================

        if (
            bestMatch.label !== "unknown"
            &&
            person
        )
        {

            nameStatus.innerText =
                person.name;

            typeStatus.innerText =
                person.type;


            drawKnown(

                box,

                person.name,

                person.type

            );

        }

        // ====================================================
        // UNKNOWN
        // ====================================================

        else
        {

            nameStatus.innerText =
                "UNKNOWN";

            typeStatus.innerText =
                "-";


            drawUnknown(
                box
            );

        }

    }

    catch(error)
    {

        console.error(
            "Recognition error:",
            error
        );

    }

}


// ============================================================
// DRAW KNOWN
// ============================================================

function drawKnown(
    box,
    name,
    type
)
{

    const ctx =
        canvas.getContext("2d");


    ctx.strokeStyle =
        "#00ff55";

    ctx.lineWidth =
        4;


    ctx.strokeRect(

        box.x,

        box.y,

        box.width,

        box.height

    );


    const label =
        "✓ " +
        name +
        " [" +
        type +
        "]";


    ctx.font =
        "bold 18px Arial";


    const width =
        ctx.measureText(
            label
        ).width;


    const y =
        box.y +
        box.height +
        5;


    ctx.fillStyle =
        "rgba(0,255,80,0.85)";


    ctx.fillRect(

        box.x,

        y,

        width + 12,

        28

    );


    ctx.fillStyle =
        "#000";


    ctx.fillText(

        label,

        box.x + 6,

        y + 20

    );

}


// ============================================================
// DRAW UNKNOWN
// ============================================================

function drawUnknown(
    box
)
{

    const ctx =
        canvas.getContext("2d");


    ctx.strokeStyle =
        "#ff4444";

    ctx.lineWidth =
        4;


    ctx.strokeRect(

        box.x,

        box.y,

        box.width,

        box.height

    );


    const label =
        "UNKNOWN";


    ctx.font =
        "bold 18px Arial";


    const width =
        ctx.measureText(
            label
        ).width;


    const y =
        box.y +
        box.height +
        5;


    ctx.fillStyle =
        "rgba(255,60,60,0.85)";


    ctx.fillRect(

        box.x,

        y,

        width + 12,

        28

    );


    ctx.fillStyle =
        "#fff";


    ctx.fillText(

        label,

        box.x + 6,

        y + 20

    );

}


// ============================================================
// REGISTER MODAL
// ============================================================

function openRegister()
{

    if (!cameraStream)
    {

        alert(
            "Nyalakan kamera terlebih dahulu."
        );

        return;

    }


    capturedDescriptor =
        null;


    document.getElementById(
        "personName"
    ).value = "";


    document.getElementById(
        "personId"
    ).value = "";


    document.getElementById(
        "personType"
    ).value =
        "SISWA";


    document.getElementById(
        "sampleStatus"
    ).innerText =
        "Belum mengambil sampel wajah.";


    document.getElementById(
        "registerModal"
    ).style.display =
        "block";

}


// ============================================================
// CLOSE REGISTER
// ============================================================

function closeRegister()
{

    document.getElementById(
        "registerModal"
    ).style.display =
        "none";

}


// ============================================================
// CAPTURE FACE
// ============================================================

async function captureFace()
{

    const sampleStatus =
        document.getElementById(
            "sampleStatus"
        );


    sampleStatus.innerText =
        "⏳ Mendeteksi wajah...";


    try
    {

        const detection =
            await faceapi
                .detectSingleFace(

                    video,

                    new faceapi
                        .TinyFaceDetectorOptions({

                            inputSize: 320,

                            scoreThreshold: 0.5

                        })

                )
                .withFaceLandmarks()
                .withFaceDescriptor();


        if (!detection)
        {

            sampleStatus.innerText =
                "❌ Wajah tidak ditemukan. Hadapkan wajah ke kamera.";

            return;

        }


        capturedDescriptor =
            Array.from(
                detection.descriptor
            );


        sampleStatus.innerText =
            "✅ Sampel wajah berhasil diambil.";

    }

    catch(error)
    {

        console.error(
            error
        );


        sampleStatus.innerText =
            "❌ Gagal mengambil sampel.";

    }

}


// ============================================================
// SAVE PERSON
// ============================================================

function savePerson()
{

    const name =
        document.getElementById(
            "personName"
        ).value.trim();


    const type =
        document.getElementById(
            "personType"
        ).value;


    const identity =
        document.getElementById(
            "personId"
        ).value.trim();


    if (!name)
    {

        alert(
            "Nama harus diisi."
        );

        return;

    }


    if (!identity)
    {

        alert(
            "Nomor identitas harus diisi."
        );

        return;

    }


    if (!capturedDescriptor)
    {

        alert(
            "Ambil sampel wajah terlebih dahulu."
        );

        return;

    }


    const person = {

        id:
            "person_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2),

        name:
            name,

        type:
            type,

        identity:
            identity,

        descriptors:
            [
                capturedDescriptor
            ],

        created:
            new Date().toISOString()

    };


    people.push(
        person
    );


    saveDatabase();

    rebuildFaceMatcher();

    updateDatabaseUI();


    alert(
        "Data " +
        name +
        " berhasil disimpan."
    );


    closeRegister();

}


// ============================================================
// DELETE PERSON
// ============================================================

function deletePerson(
    id
)
{

    const person =
        people.find(
            p =>
                p.id === id
        );


    if (!person)
        return;


    if (
        !confirm(
            "Hapus data " +
            person.name +
            "?"
        )
    )
        return;


    people =
        people.filter(
            p =>
                p.id !== id
        );


    saveDatabase();

    rebuildFaceMatcher();

    updateDatabaseUI();

}


// ============================================================
// EXPORT DATABASE
// ============================================================

function exportDatabase()
{

    if (people.length === 0)
    {

        alert(
            "Database masih kosong."
        );

        return;

    }


    const data =
        JSON.stringify(
            people,
            null,
            2
        );


    const blob =
        new Blob(

            [data],

            {
                type:
                    "application/json"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "database-wajah.json";


    a.click();


    URL.revokeObjectURL(
        url
    );

}


// ============================================================
// IMPORT DATABASE
// ============================================================

function importDatabase(
    event
)
{

    const file =
        event.target.files[0];


    if (!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        function()
        {

            try
            {

                const imported =
                    JSON.parse(
                        reader.result
                    );


                if (!Array.isArray(
                    imported
                ))
                {

                    throw new Error(
                        "Format database tidak valid."
                    );

                }


                people =
                    imported;


                saveDatabase();

                rebuildFaceMatcher();

                updateDatabaseUI();


                alert(
                    "Database berhasil diimport."
                );

            }

            catch(error)
            {

                alert(
                    "Gagal import database: " +
                    error.message
                );

            }

        };


    reader.readAsText(
        file
    );

}


// ============================================================
// PAGE LOAD
// ============================================================

window.addEventListener(

    "load",

    loadModels

);


// ============================================================
// CLOSE MODAL WHEN CLICK OUTSIDE
// ============================================================

window.addEventListener(

    "click",

    function(event)
    {

        const modal =
            document.getElementById(
                "registerModal"
            );


        if (
            event.target === modal
        )
        {

            closeRegister();

        }

    }

);

</script>
