<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FACE ABSENSI</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
body{margin:0;padding:15px;background:#101010;color:#fff;font-family:Arial,sans-serif}.c{max-width:850px;margin:auto}.s,.p{padding:12px;background:#202020;border-radius:9px;margin:12px 0;text-align:center}.ok{color:#5f7}.bad{color:#f66}.warn{color:#fd6}.cam{position:relative;max-width:700px;margin:auto;background:#000}.cam video{width:100%;display:block;transform:scaleX(-1)}.cam canvas{position:absolute;inset:0;width:100%;height:100%}button{padding:11px 16px;margin:5px;border:0;border-radius:7px;color:#fff;background:#1976d2;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.green{background:#16833b}.orange{background:#b66a00}.gray{background:#444}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #444;text-align:left;white-space:nowrap}.scroll{overflow:auto}
</style>
</head>
<body>
<div class="c">
<h1>📷 FACE ABSENSI</h1>
<div class="s" id="status">Memuat sistem...</div>
<div class="cam"><video id="video" autoplay muted playsinline></video><canvas id="cv"></canvas></div>
<p>
<button id="start">▶ START CAMERA</button>
<button id="gps" class="green">📍 AKTIFKAN GPS</button>
<button id="stop" class="gray">⏹ STOP</button>
<button id="admin" class="orange">🔐 ADMIN</button>
</p>
<div class="p">
MODEL: <span id="model">...</span><br>
GPS: <span id="gpss">-</span><br>
JARAK SEKOLAH: <span id="dist">-</span><br>
RADIUS: <span id="rad">-</span><br>
WAJAH: <span id="face">-</span><br>
NAMA: <span id="name">-</span><br>
KATEGORI: <span id="type">-</span><br>
FACE DISTANCE: <span id="score">-</span><br>
ABSENSI: <span id="att">-</span><br>
DATABASE: <span id="db">0</span>
</div>
<div class="p"><h2>🕘 Absensi Hari Ini</h2><div id="today">Memuat...</div></div>
</div>
<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbxMP6hm7ctCC2pfcButCpxysw02C62aU7usatWJpSvodHbQnq5PKJC7KjsZn4yS5B5y/exec';
const MODEL='./models';
let people=[],matcher=null,stream=null,run=false,pos=null,cfg={latitude:-6.850462985142871,longitude:106.74273114606484,radius:100},last={id:'',t:0},gpsWatch=null;
const $=id=>document.getElementById(id);
function setStatus(text,cls=''){const el=$('status');el.textContent=text;el.className='s '+cls}
async function getApi(action){const r=await fetch(API+'?action='+encodeURIComponent(action)+'&t='+Date.now());const d=await r.json();if(!d.success)throw Error(d.error||'API gagal');return d}
async function postApi(data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});const d=await r.json();if(!d.success&&!d.duplicate&&!d.outsideRadius)throw Error(d.error||'API gagal');return d}
async function init(){
 try{
  setStatus('⏳ Memuat model wajah...','warn');
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL);
  $('model').textContent='OK';
  const c=await getApi('config');cfg=c.config;$('rad').textContent=cfg.radius+' m';
  const f=await getApi('faces');people=f.people||f.data||[];buildMatcher();$('db').textContent=people.length;
  await today();setStatus('✅ SISTEM SIAP — tombol sudah aktif','ok');
 }catch(e){
  $('model').textContent='GAGAL';
  setStatus('⚠️ '+e.message,'bad');
  try{const c=await getApi('config');cfg=c.config;$('rad').textContent=cfg.radius+' m'}catch(_){ }
 }
}
function buildMatcher(){let a=[];people.forEach(p=>{const d=(p.descriptors||[]).filter(x=>Array.isArray(x)&&x.length===128).map(x=>new Float32Array(x));if(d.length)a.push(new faceapi.LabeledFaceDescriptors(String(p.id),d))});matcher=a.length?new faceapi.FaceMatcher(a,.52):null}
async function startCam(){
 if(stream){setStatus('📷 KAMERA SUDAH AKTIF','ok');return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('❌ Browser tidak mendukung kamera atau halaman belum HTTPS','bad');return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('video').srcObject=stream;await $('video').play();$('cv').width=$('video').videoWidth||640;$('cv').height=$('video').videoHeight||480;run=true;setStatus('📷 KAMERA AKTIF','ok');loop()}catch(e){setStatus('❌ Kamera: '+e.message,'bad')}
}
function stopCam(){run=false;if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}$('video').srcObject=null;setStatus('⏹ KAMERA BERHENTI')}
function gps(){
 if(!navigator.geolocation){$('gpss').textContent='❌ Browser tidak mendukung GPS';return}
 $('gpss').textContent='Meminta izin lokasi...';
 if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);
 gpsWatch=navigator.geolocation.watchPosition(p=>{pos=p;const d=distance(p.coords.latitude,p.coords.longitude,cfg.latitude,cfg.longitude);$('dist').textContent=Math.round(d)+' m';if(d<=cfg.radius){$('gpss').textContent='✅ DI DALAM RADIUS';$('gpss').className='ok'}else{$('gpss').textContent='❌ DI LUAR RADIUS';$('gpss').className='bad'}},e=>{$('gpss').textContent='❌ GPS: '+e.message;$('gpss').className='bad'},{enableHighAccuracy:true,maximumAge:3000,timeout:10000});
}
async function loop(){if(!run)return;try{if($('video').readyState>=2){const d=await faceapi.detectAllFaces($('video'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptors();draw(d)}}catch(e){}setTimeout(loop,180)}
function draw(ds){const c=$('cv').getContext('2d');c.clearRect(0,0,$('cv').width,$('cv').height);const size={width:$('video').videoWidth||640,height:$('video').videoHeight||480};faceapi.matchDimensions($('cv'),size);faceapi.resizeResults(ds,size).forEach(r=>{const o=r.detection.box,b={x:$('cv').width-o.x-o.width,y:o.y,width:o.width,height:o.height};if(!matcher){unknown(c,b);return}const m=matcher.findBestMatch(r.descriptor),p=people.find(x=>String(x.id)===String(m.label));if(p&&m.label!=='unknown'){known(c,b,p);$('face').textContent='DIKENAL';$('name').textContent=p.name;$('type').textContent=p.type;$('score').textContent=m.distance.toFixed(3);maybe(p)}else{unknown(c,b);$('face').textContent='UNKNOWN';$('name').textContent='-';$('type').textContent='-';$('score').textContent=m.distance.toFixed(3)}})}
function known(c,b,p){c.strokeStyle='#0f5';c.lineWidth=4;c.strokeRect(b.x,b.y,b.width,b.height);c.fillStyle='#0f5';c.font='bold 18px Arial';c.fillText('✓ '+p.name,b.x,b.y+b.height+20)}
function unknown(c,b){c.strokeStyle='#f44';c.lineWidth=4;c.strokeRect(b.x,b.y,b.width,b.height);c.fillStyle='#f44';c.font='bold 18px Arial';c.fillText('UNKNOWN',b.x,b.y+b.height+20)}
async function maybe(p){const now=Date.now();if(last.id===p.id&&now-last.t<7000)return;last={id:p.id,t:now};if(!pos){$('att').textContent='⚠ AKTIFKAN GPS';return}const d=distance(pos.coords.latitude,pos.coords.longitude,cfg.latitude,cfg.longitude);if(d>cfg.radius){$('att').textContent='❌ DI LUAR RADIUS';return}try{const r=await postApi({action:'attendance',data:{id:p.id,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy}});$('att').textContent=r.duplicate?'⚠ SUDAH ABSEN HARI INI':'✅ HADIR '+r.time+' ('+r.distance+' m)';await today()}catch(e){$('att').textContent='❌ '+e.message}}
async function today(){try{const d=await getApi('attendanceToday'),a=d.attendance||d.data||[];if(!a.length){$('today').textContent='Belum ada absensi.';return}let h='<div class="scroll"><table><tr><th>Jam</th><th>Nama</th><th>Kategori</th><th>ID</th><th>Status</th><th>Jarak</th></tr>';a.forEach(x=>h+='<tr><td>'+esc(x.time)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.id)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.distance)+' m</td></tr>');$('today').innerHTML=h+'</table></div>'}catch(e){$('today').textContent='Gagal mengambil data: '+e.message}}
function esc(x){const d=document.createElement('div');d.textContent=x??'';return d.innerHTML}
function distance(a,b,c,d){const R=6371000,q=Math.PI/180,da=(c-a)*q,db=(d-b)*q,x=Math.sin(da/2)**2+Math.cos(a*q)*Math.cos(c*q)*Math.sin(db/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
window.addEventListener('DOMContentLoaded',()=>{
 $('start').addEventListener('click',startCam);
 $('gps').addEventListener('click',gps);
 $('stop').addEventListener('click',stopCam);
 $('admin').addEventListener('click',()=>location.href='admin.html');
 init();
});
</script>
</body></html>
