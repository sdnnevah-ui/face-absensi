<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Face Absensi - Detection & Recognition
</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    background: #111;

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;

}

.container {

    max-width: 850px;

    margin: auto;

}

h1 {

    margin-bottom: 5px;

}

.subtitle {

    color: #aaa;

    margin-bottom: 20px;

}

.camera {

    position: relative;

    width: 100%;

    max-width: 640px;

    margin: auto;

    background: black;

    border: 2px solid #444;

    border-radius: 10px;

    overflow: hidden;

}

video {

    display: block;

    width: 100%;

    height: auto;

    transform: scaleX(-1);

}

canvas {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    transform: scaleX(-1);

}

.status {

    margin: 15px auto;

    padding: 12px;

    max-width: 640px;

    border-radius: 8px;

    background: #222;

    color: #aaa;

    font-weight: bold;

}

.status.ready {

    background: #063b16;

    color: #55ff77;

}

.status.error {

    background: #4b0808;

    color: #ff7777;

}

.status.loading {

    background: #3a3000;

    color: #ffe66b;

}

button {

    padding: 12px 25px;

    margin: 10px;

    border: none;

    border-radius: 7px;

    background: #1976d2;

    color: white;

    font-size: 16px;

    cursor: pointer;

}

button:hover {

    background: #2196f3;

}

button:disabled {

    background: #555;

    cursor: not-allowed;

}

.info {

    max-width: 640px;

    margin: 20px auto;

    padding: 15px;

    background: #1d1d1d;

    border-radius: 8px;

    text-align: left;

    font-family: monospace;

    line-height: 1.7;

}

.green {

    color: #00ff66;

}

.yellow {

    color: #ffe66b;

}

.red {

    color: #ff5555;

}

</style>

</head>


<body>


<div class="container">


<h1>
📷 FACE ABSENSI
</h1>

<div class="subtitle">

ESP32 / Android / PC → Face Detection + Recognition

</div>


<div id="status"
     class="status loading">

⏳ Memuat model AI...

</div>


<div class="camera">

<video id="video"
       autoplay
       muted
       playsinline>
</video>

<canvas id="overlay">
</canvas>

</div>


<button id="startButton"
        onclick="startCamera()"
        disabled>

▶ START CAMERA

</button>


<div class="info">

<div>
MODEL:
<span id="modelStatus"
      class="yellow">

Loading...

</span>
</div>

<div>
FACE:
<span id="faceStatus"
      class="yellow">

-

</span>
</div>

<div>
NAMA:
<span id="nameStatus"
      class="yellow">

-

</span>
</div>

<div>
SCORE:
<span id="scoreStatus"
      class="yellow">

-

</span>
</div>

</div>


</div>


<script>


// ============================================================
// CONFIGURATION
// ============================================================

const MODEL_URL = "./models";


// ============================================================
// ELEMENT
// ============================================================

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("overlay");

const statusBox =
    document.getElementById("status");

const modelStatus =
    document.getElementById("modelStatus");

const faceStatus =
    document.getElementById("faceStatus");

const nameStatus =
    document.getElementById("nameStatus");

const scoreStatus =
    document.getElementById("scoreStatus");

const startButton =
    document.getElementById("startButton");


// ============================================================
// FACE DATABASE
//
// NANTI KITA ISI FOTO/NAMA DI SINI
// ============================================================

const labeledDescriptors = [];


// ============================================================
// LOAD MODELS
// ============================================================

async function loadModels()
{

    try
    {

        statusBox.className =
            "status loading";

        statusBox.innerText =
            "⏳ Memuat Tiny Face Detector...";


        await faceapi.nets.tinyFaceDetector
            .loadFromUri(MODEL_URL);


        console.log(
            "Tiny Face Detector loaded");


        statusBox.innerText =
            "⏳ Memuat Face Landmark 68...";


        await faceapi.nets.faceLandmark68Net
            .loadFromUri(MODEL_URL);


        console.log(
            "Face Landmark 68 loaded");


        statusBox.innerText =
            "⏳ Memuat Face Recognition...";


        await faceapi.nets.faceRecognitionNet
            .loadFromUri(MODEL_URL);


        console.log(
            "Face Recognition loaded");


        modelStatus.innerText =
            "SEMUA MODEL OK";

        modelStatus.className =
            "green";


        statusBox.className =
            "status ready";

        statusBox.innerText =
            "✅ MODEL AI SIAP";


        startButton.disabled =
            false;


        console.log(
            "================================");

        console.log(
            "ALL FACE-API MODELS READY");

        console.log(
            "================================");

    }

    catch(error)
    {

        console.error(
            "MODEL ERROR:",
            error);


        statusBox.className =
            "status error";


        statusBox.innerText =
            "❌ GAGAL MEMUAT MODEL";


        modelStatus.innerText =
            error.message;


        modelStatus.className =
            "red";

    }

}


// ============================================================
// START CAMERA
// ============================================================

async function startCamera()
{

    try
    {

        statusBox.className =
            "status loading";

        statusBox.innerText =
            "⏳ Meminta akses kamera...";


        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: "user",

                        width: {
                            ideal: 640
                        },

                        height: {
                            ideal: 480
                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        statusBox.className =
            "status ready";

        statusBox.innerText =
            "📷 KAMERA AKTIF";


        startButton.disabled =
            true;


        video.addEventListener(
            "loadedmetadata",
            () =>
            {

                canvas.width =
                    video.videoWidth;

                canvas.height =
                    video.videoHeight;

                startDetection();

            },
            {
                once: true
            });

    }

    catch(error)
    {

        console.error(
            error);


        statusBox.className =
            "status error";


        statusBox.innerText =
            "❌ GAGAL MEMBUKA KAMERA";


        faceStatus.innerText =
            error.name;


        faceStatus.className =
            "red";

    }

}


// ============================================================
// FACE DETECTION
// ============================================================

let detecting = false;


async function startDetection()
{

    if (detecting)
        return;


    detecting = true;


    console.log(
        "Face detection started");


    detectLoop();

}


// ============================================================
// DETECTION LOOP
// ============================================================

async function detectLoop()
{

    if (!video.videoWidth)
    {

        requestAnimationFrame(
            detectLoop);

        return;

    }


    try
    {

        const detections =
            await faceapi
                .detectAllFaces(

                    video,

                    new faceapi
                        .TinyFaceDetectorOptions({

                            inputSize: 320,

                            scoreThreshold: 0.5

                        })

                )
                .withFaceLandmarks()
                .withFaceDescriptors();


        drawResults(
            detections);


    }

    catch(error)
    {

        console.error(
            "Detection error:",
            error);

    }


    setTimeout(
        detectLoop,
        100);

}


// ============================================================
// DRAW RESULTS
// ============================================================

function drawResults(
    detections)
{

    const displaySize = {

        width:
            video.videoWidth,

        height:
            video.videoHeight

    };


    faceapi.matchDimensions(
        canvas,
        displaySize);


    const resized =
        faceapi.resizeResults(
            detections,
            displaySize);


    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height);


    // ========================================================
    // NO FACE
    // ========================================================

    if (resized.length === 0)
    {

        faceStatus.innerText =
            "TIDAK ADA WAJAH";

        faceStatus.className =
            "yellow";


        nameStatus.innerText =
            "-";


        scoreStatus.innerText =
            "-";


        return;

    }


    // ========================================================
    // FACE DETECTED
    // ========================================================

    faceStatus.innerText =
        resized.length +
        " WAJAH TERDETEKSI";

    faceStatus.className =
        "green";


    // ========================================================
    // LOOP ALL FACES
    // ========================================================

    resized.forEach(
        (result, index) =>
        {

            const box =
                result.detection.box;


            const score =
                result.detection.score;


            // =================================================
            // DRAW BOX
            // =================================================

            ctx.strokeStyle =
                "#00ff55";

            ctx.lineWidth =
                3;


            ctx.strokeRect(

                box.x,

                box.y,

                box.width,

                box.height

            );


            // =================================================
            // SCORE
            // =================================================

            ctx.fillStyle =
                "#00ff55";

            ctx.font =
                "bold 18px Arial";


            ctx.fillText(

                "FACE " +
                (score * 100)
                    .toFixed(1) +
                "%",

                box.x,

                Math.max(
                    20,
                    box.y - 8)

            );


            // =================================================
            // RECOGNITION
            // =================================================

            if (
                labeledDescriptors.length > 0
            )
            {

                recognizeFace(
                    result,
                    box);

            }

            else
            {

                ctx.fillStyle =
                    "#ffe66b";

                ctx.font =
                    "bold 18px Arial";


                ctx.fillText(

                    "UNKNOWN",

                    box.x,

                    box.y +
                    box.height +
                    25

                );


                nameStatus.innerText =
                    "UNKNOWN";

            }

        });

}


// ============================================================
// FACE RECOGNITION
// ============================================================

function recognizeFace(
    result,
    box)
{

    try
    {

        const faceMatcher =
            new faceapi.FaceMatcher(
                labeledDescriptors,
                0.6);


        const bestMatch =
            faceMatcher.findBestMatch(
                result.descriptor);


        const name =
            bestMatch.label;


        const distance =
            bestMatch.distance;


        nameStatus.innerText =
            name;


        scoreStatus.innerText =
            distance.toFixed(3);


        const ctx =
            canvas.getContext("2d");


        if (
            name !== "unknown"
        )
        {

            ctx.fillStyle =
                "#00ff55";

            ctx.font =
                "bold 20px Arial";


            ctx.fillText(

                "✓ " + name,

                box.x,

                box.y +
                box.height +
                28

            );

        }

        else
        {

            ctx.fillStyle =
                "#ff5555";

            ctx.font =
                "bold 20px Arial";


            ctx.fillText(

                "UNKNOWN",

                box.x,

                box.y +
                box.height +
                28

            );

        }

    }

    catch(error)
    {

        console.error(
            "Recognition error:",
            error);

    }

}


// ============================================================
// PAGE LOAD
// ============================================================

window.addEventListener(
    "load",
    loadModels);


</script>


</body>

</html>
